version: "3.9"

services:

  # ── Express backend ─────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: foodrush_server
    restart: unless-stopped
    env_file: ./server/.env          # reads MONGO_URI, JWT_SECRET, etc.
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost   # nginx serves client on port 80
    ports:
      - "5000:5000"                  # optional: expose directly for debugging
    networks:
      - foodrush_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── React frontend (nginx) ───────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: foodrush_client
    restart: unless-stopped
    ports:
      - "80:80"                      # app available at http://localhost
    depends_on:
      server:
        condition: service_healthy   # wait for backend to be ready
    networks:
      - foodrush_net

networks:
  foodrush_net:
    driver: bridge
