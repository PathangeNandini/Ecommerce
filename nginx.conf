# ─────────────────────────────────────────────────────────
#  nginx.conf
#  Placed at /etc/nginx/conf.d/default.conf inside the
#  Dockerfile.client nginx container.
#
#  Responsibilities:
#    1. Serve the Vite-built React SPA (index.html fallback)
#    2. Proxy /api/* and /socket.io/* requests to the backend
#    3. Enable gzip compression for faster load times
# ─────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ── Static assets — long-term cache ─────────────────
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy: REST API → backend container ─────────────
    location /api/ {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy: Socket.io → backend container ─────────────
    location /socket.io/ {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── SPA fallback — all other routes → index.html ────
    # React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
